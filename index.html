<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BobyMusc a déménagé</title>
<meta http-equiv="refresh" content="3; url=https://bobymusc-app.web.app/">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0E0F12; color: #F2F3F5;
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  b { color: #FF6B1A; }
  a { display: inline-block; margin-top: 18px; background: #FF6B1A; color: #fff; padding: 14px 22px; border-radius: 12px; text-decoration: none; font-weight: 700; }
  p { color: #9097A3; }
</style>
</head>
<body>
<div>
  <h1>Boby<b>Musc</b> a déménagé 🏋️</h1>
  <p>La nouvelle adresse est <b>bobymusc-app.web.app</b>.<br>Si tu avais installé l’appli, supprime l’ancienne icône et réinstalle-la depuis la nouvelle adresse.</p>
  <a href="https://bobymusc-app.web.app/">Aller sur BobyMusc</a>
</div>
<script>
  // Désinstalle l'ancienne version hors ligne puis redirige
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  setTimeout(() => location.replace('https://bobymusc-app.web.app/'), 3000);
</script>
</body>
</html>
